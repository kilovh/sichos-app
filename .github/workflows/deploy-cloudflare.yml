name: Deploy to Cloudflare Pages

# Builds the site and publishes it to Cloudflare Pages, which (unlike free GitHub Pages) works from a
# private repo. Does nothing until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

env:
  # An unremarkable name: the site lives at https://sichos-02273f.pages.dev
  PROJECT: sichos-02273f

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::Cloudflare secrets aren't set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.creds.outputs.skip != 'true'
        run: npm ci && npm test && npm run build
      - name: Publish
        if: steps.creds.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy build --project-name "$PROJECT" --branch main --commit-dirty=true
